services:
  db:
    image: pgvector/pgvector:pg16
    container_name: findoc-db
    environment:
      POSTGRES_USER: findoc
      POSTGRES_PASSWORD: findoc
      POSTGRES_DB: findoc
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findoc -d findoc"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
